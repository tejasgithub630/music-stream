{% extends 'music/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div id="login-bg-container" style="position: fixed; inset: 0; z-index: 0;">
  <canvas id="login-bg-canvas" style="width:100vw; height:100vh; display:block;"></canvas>
</div>
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; position: relative; z-index: 1;">
  <div style="background: #181818; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.3); padding: 40px 32px; min-width: 340px; max-width: 400px; width: 100%;">
    <h2 style="color: #03a9f4; margin-bottom: 24px;">Log In</h2>
    <form method="post" autocomplete="off">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div style="margin-bottom: 18px;">
        <label style="color: #b3b3b3;">Username</label>
        {{ form.username }}
      </div>
      <div style="margin-bottom: 18px;">
        <label style="color: #b3b3b3;">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn" style="width: 100%; background: #03a9f4; color: #fff; font-weight: bold;">Log In</button>
      <div style="margin-top: 18px; text-align: center;">
        <span style="color: #b3b3b3;">Don't have an account?</span>
        <a href="{% url 'signup' %}" style="color: #03a9f4; text-decoration: underline;">Sign Up</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Animated lines background for login
const canvas = document.getElementById('login-bg-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const lines = Array.from({length: 18}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  dx: (Math.random() - 0.5) * 1.2,
  dy: (Math.random() - 0.5) * 1.2
}));
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.globalAlpha = 0.7;
  lines.forEach(line => {
    ctx.beginPath();
    ctx.moveTo(line.x, line.y);
    ctx.lineTo(line.x + line.dx * 40, line.y + line.dy * 40);
    ctx.strokeStyle = 'rgba(74, 144, 226, 0.95)'; // bright blue
    ctx.shadowColor = '#4a90e2';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Move
    line.x += line.dx;
    line.y += line.dy;
    if (line.x < 0 || line.x > canvas.width) line.dx *= -1;
    if (line.y < 0 || line.y > canvas.height) line.dy *= -1;
  });
  ctx.restore();
  requestAnimationFrame(draw);
}
draw();
</script>
{% endblock %}
